<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contributions — PPBS</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/l6.css">
</head>
<body data-page="contributions">

{{topbar}}

<div class="page-header">
  <div class="sec-label">Credit</div>
  <div class="header-body">
    <h1><span>Credit</span> &amp; contributions</h1>
    <p class="subtitle">A public, role-specific record of the people building PPBS through research, infrastructure, mentoring, governance, dissemination, and country adaptation.</p>
  </div>
</div>

<div class="page-content contributions-page">
  <div class="sec-label">Register</div>
  <div class="content-body">
    {{content}}

    <div class="contribution-filters" aria-label="Filter public contribution records">
      <label>Contribution area
        <select id="contribution-area-filter">{{area_options}}</select>
      </label>
      <label>Country or context
        <select id="contribution-country-filter">{{country_options}}</select>
      </label>
      <label>Language
        <select id="contribution-language-filter">{{language_options}}</select>
      </label>
      <label>Role
        <select id="contribution-role-filter">{{role_options}}</select>
      </label>
      <button type="button" id="contribution-filter-reset">Clear filters</button>
    </div>

    <p class="contribution-count" id="contribution-count" aria-live="polite"></p>
    <div class="contribution-register" id="contribution-register">
      {{contribution_records}}
    </div>
  </div>
</div>

{{footer}}

<script src="js/nav.js"></script>
<script src="js/contributions.js"></script>
</body>
</html>
